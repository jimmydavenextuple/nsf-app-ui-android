import com.nextuple.nsf.UtilKt as Util

plugins {
	id 'com.android.application'
	id 'com.google.dagger.hilt.android'
	id 'org.jetbrains.kotlin.android'

	id 'kotlin-kapt'
	id 'maven-publish'
	id 'jacoco'
	id "shot"
}

def APK_VERSION = Util.getVersion()

def STORE_FILE = file("$project.rootDir/nextuple-keystore.jks")
def STORE_PASSWORD = Util.getEnv('STORE_PASSWORD')
def KEY_ALIAS = Util.getEnv('KEY_ALIAS')
def KEY_PASSWORD = Util.getEnv('KEY_PASSWORD')

def APP_CENTER_KEY = Util.getEnv('APP_CENTER_KEY')

def GOAT_API_URL_LOCAL = Util.getEnv('GOAT_API_LOCAL')
def GOAT_API_URL_DEV = Util.getEnv('GOAT_API_DEV')
def GOAT_API_URL_STAGE = Util.getEnv('GOAT_API_STAGE')
def GOAT_API_URL_PROD = Util.getEnv('GOAT_API_PROD')

def CLARITY_PROJECT_ID_STAGE = Util.getEnv('GOAT_CLARITY_STAGE')
def CLARITY_PROJECT_ID_PROD = Util.getEnv('GOAT_CLARITY_PROD')

android {
	namespace 'com.nextuple.nsf'
	compileSdk 33

	signingConfigs {
		nsf {
			storeFile STORE_FILE
			storePassword STORE_PASSWORD
			keyAlias KEY_ALIAS
			keyPassword KEY_PASSWORD
		}
	}

	defaultConfig {
		applicationId "com.nextuple.nsf"
		minSdk 27
		versionCode 1
		versionName APK_VERSION
		signingConfig signingConfigs.nsf

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		testInstrumentationRunner "com.karumi.shot.ShotTestRunner"

		vectorDrawables {
			useSupportLibrary true
		}

		multiDexEnabled true

		buildConfigField "String", "APP_VERSION", "\"$APK_VERSION\""
		buildConfigField "String", "APP_CENTER_KEY", "\"$APP_CENTER_KEY\""
	}

	buildTypes {
		debug {
			signingConfig signingConfigs.nsf
			testCoverageEnabled true
		}
		release {
			signingConfig signingConfigs.nsf

			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	flavorDimensions 'default'

	productFlavors {
		prod {
			applicationId "com.nextuple.nsf"

			buildConfigField "String", "GOAT_API_URL", "\"$GOAT_API_URL_PROD\""
			buildConfigField "String", "CLARITY_PROJECT_ID", "\"$CLARITY_PROJECT_ID_PROD\""
		}

		stage {
			applicationId "com.nextuple.nsf.stage"

			buildConfigField "String", "GOAT_API_URL", "\"$GOAT_API_URL_STAGE\""
			buildConfigField "String", "CLARITY_PROJECT_ID", "\"$CLARITY_PROJECT_ID_STAGE\""
		}

		dev {
			applicationId "com.nextuple.nsf.dev"

			buildConfigField "String", "GOAT_API_URL", "\"$GOAT_API_URL_DEV\""
			buildConfigField "String", "CLARITY_PROJECT_ID", "\"\""
		}

		local {
			applicationId "com.nextuple.nsf.local"

			buildConfigField "String", "GOAT_API_URL", "\"$GOAT_API_URL_LOCAL\""
			buildConfigField "String", "CLARITY_PROJECT_ID", "\"\""
		}
	}

	publishing {
		singleVariant('stageDebug') {
			publishApk()
		}

		singleVariant('prodRelease') {
			publishApk()
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

//	kotlinOptions {
//		jvmTarget = JavaVersion.VERSION_17
//	}

	kotlin {
		jvmToolchain(17)
	}

	buildFeatures {
		compose true
	}

	composeOptions {
		kotlinCompilerExtensionVersion '1.4.3'
	}

	packagingOptions {
		resources {
			excludes += '/META-INF/{AL2.0,LGPL2.1}'
		}
	}

	testOptions {
		unitTests {
			includeAndroidResources = true
		}
	}
}

dependencies {
	// AndroidX
	implementation 'androidx.core:core-ktx:1.10.1'
	implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
	testImplementation 'androidx.test.ext:junit:1.1.5'
	testImplementation 'androidx.test.espresso:espresso-core:3.5.1'

	// AndroidX - Compose - BOM
	def composeBom = platform('androidx.compose:compose-bom:2023.01.00')
	implementation composeBom
	testImplementation composeBom
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.compose.ui:ui-tooling-preview'
	debugImplementation 'androidx.compose.ui:ui-tooling'
	testImplementation 'androidx.compose.ui:ui-test-junit4'

	// AndroidX - Compose - Integrations
	implementation 'androidx.activity:activity-compose:1.7.2'
	implementation 'androidx.navigation:navigation-compose:2.5.3'

	// Hilt
	implementation 'com.google.dagger:hilt-android:2.45'
	kapt 'com.google.dagger:hilt-compiler:2.45'

	//Images
	implementation("io.coil-kt:coil-compose:2.3.0")

	// Retrofit
	implementation 'com.squareup.retrofit2:retrofit:2.9.0'
	implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
	implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

	// AppCenter
	implementation 'com.microsoft.appcenter:appcenter-analytics:4.4.5'
	implementation 'com.microsoft.appcenter:appcenter-crashes:4.4.5'

	// Image Loading
	implementation 'io.coil-kt:coil-compose:2.3.0'

	// Microsoft Clarity
	implementation 'com.microsoft.clarity:clarity:1.3.2'

	//noinspection GradleDependency - 1.13.4 breaks spying lambdas, this seems to be a library bug.
	testImplementation 'io.mockk:mockk:1.13.3'
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
	testImplementation 'org.robolectric:robolectric:4.7.3'

	androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
	androidTestImplementation 'androidx.test.ext:junit-ktx:1.1.5'
	androidTestImplementation platform('androidx.compose:compose-bom:2022.10.00')
}

kapt {
	correctErrorTypes true
}

afterEvaluate {
	tasks.withType(PublishToMavenRepository) { task ->
		def match = task.name =~ '^publish(.*)(Release|Debug)PublicationTo(.*)$'
		dependsOn("assemble${match[0][1]}${match[0][2]}")
	}
}