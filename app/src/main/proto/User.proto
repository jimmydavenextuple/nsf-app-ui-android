syntax = "proto3";

option java_package = "com.nextuple.nsf";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
message UserData {
    string firstName = 1;
    string lastName = 2;
    string userId = 3;
    string nodeNo = 4;
    string brand = 5;
    google.protobuf.Timestamp lastActiveTime = 6;
}