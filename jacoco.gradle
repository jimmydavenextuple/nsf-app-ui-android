jacoco {
    toolVersion = "0.8.9"
}
project.afterEvaluate {
    if (android.hasProperty("applicationVariants")) {
        android.applicationVariants.all { variant ->
            createVariantCoverage(variant)
        }
    } else if (android.hasProperty("libraryVariants")) {
        android.libraryVariants.all { variant ->
            createVariantCoverage(variant)
        }
    }
}
ext.excludes = [
        '**/*Test*.*',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/R$*.class',
        '**/R.class',
        '**/databinding/*Binding.*',
        'android/**/*.*',
        'com/nextuple/nsf/Printer*.*',
        'com/nextuple/nsf/Printers*.*',
        'com/nextuple/nsf/User*.*',
        'com/nextuple/nsf/NSFApp*.*',
        'com/nextuple/nsf/MainActivity*.*',
        'com/nextuple/nsf/datastore',
        'com/nextuple/nsf/hilt',
        'com/nextuple/nsf/retrofit/dto',
        'com/nextuple/nsf/service/dto',
        'com/nextuple/nsf/ui/ElapsedTimeChip*.*',
        'com/nextuple/nsf/ui/App*.*',
        'com/nextuple/nsf/ui/common',
        'com/nextuple/nsf/ui/component',
        'com/nextuple/nsf/ui/nav',
        'com/nextuple/nsf/ui/screen',
        'com/nextuple/nsf/ui/theme',
        'com/nextuple/nsf/ui/util',
        'com/nextuple/nsf/util',
        'dagger/hilt/internal/aggregatedroot/codegen',
        'hilt_aggregated_deps',
        // Proto
        '**/*.proto',
        // butterKnife
        '**/*$ViewInjector*.*',
        '**/*$ViewBinder*.*',
        '**/*Dagger*.*',
        '**/*Hilt*.*',
        '**/*Lambda*.class',
        '**/*Lambda.class',
        '**/*Module*.*',
        '**/*Module_*Factory.class',
        '**/*_Factory*.*',
        '**/*_MembersInjector.class',
        '**/Dagger*Component*.*',
        '**/Lambda$*.class',
        '**/Lambda.class',
        '**/di/module/*',
        // kotlin
        '**/*$Lambda$*.*',
        '**/*$ViewBinder*.*',
        '**/*$ViewInjector*.*',
        '**/*BR*.*',
        '**/*Companion*.*',
        '**/*Component*.*',
        '**/*Dagger*.*',
        '**/*Extensions*.*',
        '**/*Hilt*.*',
        '**/*MapperImpl*.*',
        '**/*MembersInjector*.*',
        '**/*Module*.*',
        '**/*_Factory*.*',
        '**/*_MembersInjector.class',
        '**/*_Provide*Factory*.*',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/pipeline/*',
        '**/.github/*',
        'version'
]
def createVariantCoverage(variant) {
    def variantName = variant.name
    def testTaskName = "test${variantName.capitalize()}UnitTest"

    // Add unit test coverage tasks
    tasks.create(name: "${testTaskName}Coverage", type: JacocoReport, dependsOn: "$testTaskName") {
        group = "Reporting"
        description = "Generate Jacoco coverage reports for the ${variantName.capitalize()} build."

        reports {
            html.required = true
        }

        def javaClasses = fileTree(dir: variant.javaCompileProvider.get().destinationDir, excludes: project.excludes)
        def kotlinClasses = fileTree(dir: "${buildDir}/tmp/kotlin-classes/${variantName}", excludes: project.excludes)
        getClassDirectories().setFrom(files([javaClasses, kotlinClasses]))

        getSourceDirectories().setFrom(files([
                "$project.projectDir/src/main/java",
                "$project.projectDir/src/${variantName}/java",
                "$project.projectDir/src/main/kotlin",
                "$project.projectDir/src/${variantName}/kotlin"
        ]))

        getExecutionData().setFrom(files("${project.buildDir}/outputs/unit_test_code_coverage/${variantName}UnitTest/${testTaskName}.exec"))

        doLast {
            def m = new File("${project.buildDir}/reports/jacoco/${testTaskName}Coverage/html/index.html")
                    .text =~ /Total[^%]*>(\d?\d?\d?%)/
            if (m) {
                println "Test coverage: ${m[0][1]}"
            }
        }
    }

    // Add unit test coverage verification tasks
    tasks.create(name: "${testTaskName}CoverageVerification", type: JacocoCoverageVerification, dependsOn: "${testTaskName}Coverage") {
        group = "Reporting"
        description = "Verifies Jacoco coverage for the ${variantName.capitalize()} build."
        violationRules {
            rule {
                element = 'BUNDLE'
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.80
                }
            }
        }
        def javaClasses = fileTree(dir: variant.javaCompileProvider.get().destinationDir, excludes: project.excludes)
        def kotlinClasses = fileTree(dir: "${buildDir}/tmp/kotlin-classes/${variantName}", excludes: project.excludes)
        getClassDirectories().setFrom(files([javaClasses, kotlinClasses]))
        getSourceDirectories().setFrom(files([
                "$project.projectDir/src/main/java",
                "$project.projectDir/src/${variantName}/java",
                "$project.projectDir/src/main/kotlin",
                "$project.projectDir/src/${variantName}/kotlin"
        ]))
        getExecutionData().setFrom(files("${project.buildDir}/outputs/unit_test_code_coverage/${variantName}UnitTest/${testTaskName}.exec"))
    }
}